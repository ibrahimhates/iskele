# Iskele behind nginx.
#
# Copy to /etc/nginx/sites-available/iskele.conf, symlink it into
# sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# Certificates: certbot --nginx -d panel.example.com

# The upgrade header is hop-by-hop: it must be forwarded when the client asked
# for an upgrade and omitted otherwise, or every ordinary request carries a
# stray Connection: upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;

    # The panel is a root-equivalent surface; there is no reason to serve it
    # over plaintext, not even to redirect a password already in flight.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.example.com;

    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # iskeled sets its own security headers, including a CSP tuned to the
    # embedded frontend. Adding another set here risks two policies that
    # disagree, so only HSTS is added — it is the one the proxy owns, because
    # only the proxy knows TLS is terminated here.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # A build context is streamed as a tar; the default of 1m truncates it.
    client_max_body_size 512m;

    location / {
        proxy_pass http://127.0.0.1:8377;
        proxy_http_version 1.1;

        # Host unchanged: the WebSocket handshake is refused unless Origin
        # matches Host, and rewriting either one breaks the console.
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events: buffering holds every event until the response
        # ends, and the response never ends. The page would load and simply
        # never update.
        proxy_buffering off;
        proxy_cache off;

        # A log stream is idle while the container is quiet, and a build can
        # run for a long time. The default 60s closes both.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
