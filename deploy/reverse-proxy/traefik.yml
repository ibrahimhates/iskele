# Iskele behind Traefik — dynamic configuration.
#
# This is the *dynamic* half. It assumes a Traefik that is already running with
# an `https` entrypoint and a certificate resolver named `letsencrypt`; point
# Traefik's static `providers.file.filename` at this file, or drop it into the
# directory `providers.file.directory` watches.
#
# Traefik reloads it without a restart.

http:
  routers:
    iskele:
      rule: "Host(`panel.example.com`)"
      entryPoints:
        - https
      service: iskele
      middlewares:
        - iskele-hsts
      tls:
        certResolver: letsencrypt

    # The panel is a root-equivalent surface; plaintext exists only to send the
    # browser somewhere else.
    iskele-http:
      rule: "Host(`panel.example.com`)"
      entryPoints:
        - http
      service: iskele
      middlewares:
        - iskele-https-redirect

  middlewares:
    iskele-https-redirect:
      redirectScheme:
        scheme: https
        permanent: true

    iskele-hsts:
      headers:
        # iskeled sets its own security headers, including a CSP tuned to the
        # embedded frontend. Only HSTS belongs here: it is the one header that
        # depends on knowing TLS terminates at this hop.
        stsSeconds: 31536000
        stsIncludeSubdomains: true

  services:
    iskele:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8377"

        # Traefik forwards WebSocket upgrades and streams responses without
        # being asked, so logs, the console and the event stream work as they
        # are. It also passes Host through unchanged, which the WebSocket
        # origin check depends on — if you add a `Host` header middleware,
        # the console stops working and the browser reports a refused origin.
        #
        # `flushInterval: -1` makes Server-Sent Events flush immediately
        # rather than on Traefik's 100ms schedule. The default works; this is
        # the difference between a live feed and a feed that stutters.
        responseForwarding:
          flushInterval: -1

        passHostHeader: true

# Read timeouts live in Traefik's *static* configuration, not here. A log
# stream is idle while its container is quiet and a build runs for minutes, so
# the defaults are too short:
#
#   entryPoints:
#     https:
#       address: ":443"
#       transport:
#         respondingTimeouts:
#           readTimeout: 0      # 0 disables it
#           idleTimeout: 1h
#
# serversTransport:
#   forwardingTimeouts:
#     idleConnTimeout: 1h
